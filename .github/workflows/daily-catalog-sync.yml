name: Daily Cinema Session Sync

on:
  schedule:
    # Runs automatically every day at 20:15 UTC (07:15 AEDT Melbourne/Sydney · 04:15 CST Shanghai)
    - cron: '15 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-sessions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore ratings & scraper caches
        uses: actions/cache@v4
        with:
          path: |
            server/cache/douban_ratings_cache.json
            server/cache/omdb_ratings_cache.json
            server/cache/mdblist_ratings_cache.json
            server/cache/imdb_title_ratings.tsv.gz
            server/cache/scraped_venue_prices.json
            server/cache/serp_venues
          key: reelhouse-sync-cache-v1-${{ github.run_id }}
          restore-keys: |
            reelhouse-sync-cache-v1-

      - name: Install dependencies
        run: npm ci

      - name: Seed previous catalog from catalog-data branch (for smart carry-forward)
        run: |
          if git fetch origin catalog-data --depth=1 2>/dev/null; then
            git checkout FETCH_HEAD -- server/cache/live_catalog.json || true
          fi

      - name: Pull fresh daily cinema sessions & film ratings
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          FORCE_EMPTY_RATINGS_REFRESH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: npm run sync

      - name: Dispatch Watchlist & 35mm/70mm drop radar alerts (optional secrets)
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REELHOUSE_ALERT_WEBHOOK_URL: ${{ secrets.REELHOUSE_ALERT_WEBHOOK_URL }}
          REELHOUSE_WATCH_TITLES: ${{ secrets.REELHOUSE_WATCH_TITLES }}
        run: npm run notify

      - name: Publish updated session catalog to catalog-data branch (0 Render rebuilds)
        run: |
          STAGE_DIR="$(mktemp -d)"
          mkdir -p "$STAGE_DIR/server/cache" "$STAGE_DIR/public"
          cp server/cache/live_catalog.json "$STAGE_DIR/server/cache/live_catalog.json"
          cp public/live_catalog.json "$STAGE_DIR/public/live_catalog.json"
          for city in melbourne sydney shanghai; do
            if [ -f "public/live_catalog_${city}.json" ]; then
              cp "public/live_catalog_${city}.json" "$STAGE_DIR/public/live_catalog_${city}.json"
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin catalog-data --depth=1 2>/dev/null; then
            git checkout -f -B catalog-data FETCH_HEAD
          else
            git checkout --orphan catalog-data
            git rm -rf --cached . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

          mkdir -p server/cache public
          cp "$STAGE_DIR/server/cache/live_catalog.json" server/cache/live_catalog.json
          cp "$STAGE_DIR/public/"live_catalog*.json public/
          rm -rf "$STAGE_DIR"

          git add server/cache/live_catalog.json public/live_catalog*.json
          if git diff --cached --quiet; then
            echo "No catalog changes detected."
            exit 0
          fi
          git commit -m "chore(catalog): automated daily cinema session & ratings sync"
          git push origin HEAD:catalog-data

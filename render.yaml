# Render.com Blueprint — 1-click Docker deployment from GitHub
services:
  - type: web
    name: reelhouse
    runtime: docker
    plan: free
    region: singapore # Closest Render region to Australia & Shanghai (or oregon)
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "1"
      - key: PUBLIC_READONLY_MODE
        value: "1"
      - key: CONTAINER_RUNTIME
        value: "1"
      - key: CACHE_TTL_HOURS
        value: "24"
      - key: RATINGS_TTL_HOURS
        value: "24"
      - key: TMDB_API_KEY
        sync: false
      - key: OMDB_API_KEY
        sync: false
      - key: MDBLIST_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
